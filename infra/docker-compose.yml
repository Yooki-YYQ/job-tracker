version: "3.9"

services:
  db:
    image: postgres:15
    container_name: jobtracker-db
    restart: always
    environment:
      POSTGRES_USER: jobuser
      POSTGRES_PASSWORD: jobpass
      POSTGRES_DB: jobtracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: jobtracker-adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  postgres_data:
